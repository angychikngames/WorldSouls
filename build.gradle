buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
version = '1.0.0'
group = 'com.angychikngames.worldsouls'
archivesBaseName = 'worldsouls-forge-1.12.2'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client { workingDirectory project.file('run') }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
}
jar {
    from('LICENSE')
    from('THIRD-PARTY-NOTICES')
}
jar.finalizedBy('reobfJar')
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}

configurations {
    legacyForgeBootstrap
}

dependencies {
    legacyForgeBootstrap('net.minecraftforge:forge:1.12.2-14.23.5.2864:universal') {
        transitive = false
    }
}

task prepareLegacyForgeLaunch(type: Copy) {
    from { configurations.legacyForgeBootstrap.collect { zipTree(it) } }
    include 'net/minecraftforge/fml/relauncher/Side.class'
    into "$buildDir/legacyForgeLaunch"
}

tasks.withType(JavaExec).matching { it.name == 'runClient' }.all {
    dependsOn prepareLegacyForgeLaunch
    doFirst {
        classpath = files(prepareLegacyForgeLaunch.destinationDir) + classpath.filter { file ->
            !(file.name ==~ /asm(-analysis|-commons|-tree|-util)?-6\.2\.jar/)
        }
    }
}
